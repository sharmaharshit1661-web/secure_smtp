name: Secure SMTP CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend PyTest Suite & Security Checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install System Dependencies (libpcap & Cairo)
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev libpango-1.0-0 libpangocairo-1.0-0 libcairo2 shared-mime-info

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Execute PyTest Suite
        run: |
          pytest -v --tb=short

  frontend-checks:
    name: Frontend Lint & Production Bundle Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node Dependencies
        working-directory: frontend
        run: npm ci

      - name: Static Lint Analysis (oxlint)
        working-directory: frontend
        run: npm run lint

      - name: Compile Production Bundle (Vite)
        working-directory: frontend
        run: npm run build

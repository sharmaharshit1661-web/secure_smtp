# ==============================================================================
# Secure SMTP — Production Docker Compose Orchestrator
# ==============================================================================
# Launches the full production stack with 1 command:
#   docker-compose up -d --build
#
# Services:
#   - frontend: React + Vite web console on Nginx (Port 80)
#   - backend:  FastAPI cryptographic assessment API (Port 8000)
#   - mongodb:  MongoDB database with authentication (Port 27017)
#   - redis:    Redis cache and async queue broker (Port 6379)
# ==============================================================================

version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: secure_smtp_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${SECURE_SMTP_MONGO_USER:-secure_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${SECURE_SMTP_MONGO_PASSWORD:?Set a unique database password}
      MONGO_INITDB_DATABASE: ${SECURE_SMTP_MONGO_DB:-secure_smtp}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - securesmtp_net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: secure_smtp_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - securesmtp_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: secure_smtp_backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - SECURE_SMTP_ENV=${SECURE_SMTP_ENV:-production}
      - SECURE_SMTP_MONGO_URI=${SECURE_SMTP_MONGO_URI:-}
      - SECURE_SMTP_MONGO_HOST=mongodb
      - SECURE_SMTP_MONGO_PORT=27017
      - SECURE_SMTP_MONGO_DB=secure_smtp
      - SECURE_SMTP_MONGO_USER=${SECURE_SMTP_MONGO_USER:-secure_admin}
      - SECURE_SMTP_MONGO_PASSWORD=${SECURE_SMTP_MONGO_PASSWORD:?Set a unique database password}
      - SECURE_SMTP_MONGO_AUTH_DB=admin
      - SECURE_SMTP_MONGO_AUTH_REQUIRED=true
      - SECURE_SMTP_API_KEY=${SECURE_SMTP_API_KEY:?Set a unique service API key}
      - SECURE_SMTP_AUTH_REQUIRED=true
      - SECURE_SMTP_LOCAL_ADMIN_EMAIL=${SECURE_SMTP_LOCAL_ADMIN_EMAIL:-}
      - SECURE_SMTP_LOCAL_PASSWORD_HASH=${SECURE_SMTP_LOCAL_PASSWORD_HASH:-}
      - SECURE_SMTP_CLERK_ISSUER=${SECURE_SMTP_CLERK_ISSUER:-}
      - SECURE_SMTP_CLERK_ORG_ID=${SECURE_SMTP_CLERK_ORG_ID:-}
      - SECURE_SMTP_DISPATCH_ALLOWED_IPS=${SECURE_SMTP_DISPATCH_ALLOWED_IPS:-127.0.0.1,::1}
      - SECURE_SMTP_RATE_LIMIT_ENABLED=${SECURE_SMTP_RATE_LIMIT_ENABLED:-true}
      - SECURE_SMTP_MAX_UPLOAD_SIZE_MB=${SECURE_SMTP_MAX_UPLOAD_SIZE_MB:-100}
      - SECURE_SMTP_ENABLE_LIVE_LAB=${SECURE_SMTP_ENABLE_LIVE_LAB:-false}
      - SECURE_SMTP_CORS_ORIGINS=${SECURE_SMTP_CORS_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173,http://127.0.0.1}
      - SECURE_SMTP_ALERTS_ENABLED=${SECURE_SMTP_ALERTS_ENABLED:-false}
      - SECURE_SMTP_ALERT_WEBHOOK_URL=${SECURE_SMTP_ALERT_WEBHOOK_URL:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    ports:
      - "127.0.0.1:8000:8000"
      - "2525-2528:2525-2528"
    volumes:
      - app_uploads:/tmp/secure_smtp_uploads
      - app_reports:/tmp/secure_smtp_reports
    networks:
      - securesmtp_net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-}
    container_name: secure_smtp_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - securesmtp_net

networks:
  securesmtp_net:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
  app_uploads:
  app_reports:

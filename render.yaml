# ==============================================================================
# Render Blueprint Specification for Secure SMTP
# ==============================================================================
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. FastAPI Core REST & WebSocket API
  # ----------------------------------------------------------------------------
  - type: web
    name: securesmtp-backend
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    plan: starter # Starter or standard recommended for packet analysis & PDF compilation
    region: oregon # or frankfurt, singapore, etc.
    healthCheckPath: /api/health
    envVars:
      - key: SECURE_SMTP_ENV
        value: production
      - key: SECURE_SMTP_DEBUG
        value: "false"
      - key: SECURE_SMTP_ENABLE_LIVE_LAB
        value: "false" # In cloud web services, live lab honeypots are disabled to save resources
      - key: SECURE_SMTP_API_KEY
        generateValue: true # Render will generate a cryptographically strong 32-char key
      - key: SECURE_SMTP_AUTH_REQUIRED
        value: "true"
      - key: SECURE_SMTP_MONGO_URI
        sync: false # Must be set in Render dashboard to your MongoDB Atlas connection string
      - key: SECURE_SMTP_MONGO_DB
        value: secure_smtp
      - key: SECURE_SMTP_MONGO_AUTH_REQUIRED
        value: "true"
      - key: SECURE_SMTP_RATE_LIMIT_ENABLED
        value: "true"
      - key: SECURE_SMTP_RATE_LIMIT_RPM
        value: "120"
      - key: SECURE_SMTP_MAX_UPLOAD_SIZE_MB
        value: "100"
      - key: SECURE_SMTP_CORS_ORIGINS
        sync: false # Set to your deployed frontend domain (e.g. https://securesmtp-frontend.onrender.com)

  # ----------------------------------------------------------------------------
  # 2. React Vite Frontend Web Console
  # ----------------------------------------------------------------------------
  - type: web
    name: securesmtp-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: securesmtp-backend
          property: host

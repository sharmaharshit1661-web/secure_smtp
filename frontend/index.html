    <meta name="theme-color" content="#f5f7f1" />
    <script>
      // Set the theme before the first paint, including while React loads.
      (() => {
        let preference;
        try { preference = localStorage.getItem('secure_smtp_theme'); } catch { /* Storage may be unavailable. */ }
        const theme = preference === 'light' || preference === 'dark'
          ? preference : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#101914' : '#f5f7f1';
      })();
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
